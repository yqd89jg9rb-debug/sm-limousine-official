<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Affiliate Portal | SM LIMOUSINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=master_portal_5.0">
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBJjQX0AwWeSZ7FHHwKBGueEwC6VYd9v60&libraries=places" async defer></script>
    <style>
        /* ELITE MOBILE OVERRIDES */
        .portal-header-elite { background: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .portal-logo { height: 50px; margin-bottom: 10px; }
        .portal-title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: #000; letter-spacing: 2px; margin-bottom: 15px; display: block; }
        .portal-call-btn { background: #5d2b45; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: 800; display: inline-block; font-size: 0.9rem; }
        .bl-container { padding-top: 30px !important; }
        .bl-fleet-card { display: flex; flex-direction: column; background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 2px solid transparent; margin-bottom: 25px; transition: 0.3s; }
        .bl-fleet-card.selected { border-color: #5d2b45; background: #fdfafb; }
        .bl-fleet-img { width: 100%; height: 240px; object-fit: cover; background: #000; }
        .bl-fleet-info { padding: 25px; }
        .bl-v-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .bl-v-name { font-size: 1.5rem; font-weight: 900; color: #1a1a1a; font-family: 'Playfair Display', serif; }
        .bl-v-price { font-size: 1.6rem; font-weight: 900; color: #5d2b45; }
        .bl-v-meta { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .bl-continue-btn { position: fixed; bottom: 25px; left: 20px; right: 20px; width: calc(100% - 40px) !important; max-width: 440px; margin: 0 auto !important; padding: 22px !important; background: #D4AF37 !important; color: #000 !important; border-radius: 18px !important; font-size: 1.1rem !important; box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4) !important; z-index: 2500; }
        #map { width: 100%; height: 250px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #eee; display: none; }
    </style>
</head>
<body class="bl-body">

    <header class="portal-header-elite">
        <img src="https://static.prod-images.emergentagent.com/jobs/f17b6fee-cc29-44c6-94cf-45fa9654051a/images/b589ae7bf307bf16f3410b6cb1ee8cb91f6cbf51ef443f48053b33604b76aa30.jpeg" class="portal-logo">
        <span class="portal-title">AFFILIATE PORTAL</span>
        <a href="tel:+18773376546" class="portal-call-btn"><i class="fas fa-phone"></i> DISPATCH: (877) 337-6546</a>
    </header>

    <div class="bl-container" id="booking">
        
        <div id="portal-intro" style="text-align: center; margin-bottom: 30px;">
            <h1 class="hero-title-sm2" style="margin: 0 0 10px;">Partner Booking</h1>
            <p style="color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; font-size: 0.75rem;">Executive Priority Dispatch Terminal</p>
        </div>

        <!-- STEP 1 -->
        <div id="bl-step-1" class="bl-step">
            <div id="map"></div>
            <div class="bl-search-card">
                <div class="bl-tabs">
                    <div class="bl-tab active trip-tab" data-trip="oneway">One-way</div>
                    <div class="bl-tab trip-tab" data-trip="roundtrip">Roundtrip</div>
                    <div class="bl-tab trip-tab" data-trip="hourly">Hourly</div>
                </div>
                <div class="bl-input-group">
                    <div class="bl-input-item"><label>Pickup *</label><input type="text" id="pickup-input" placeholder="Enter Pickup Address"></div>
                    <div class="bl-input-item"><label>Dropoff *</label><input type="text" id="dropoff-input" placeholder="Enter Destination"></div>
                </div>
                <div id="hourly-field" style="display:none; margin-bottom: 20px;">
                    <select id="trip-hours" style="width:100%; padding:15px; border-radius:12px; border:1px solid #eee;">
                        <option value="3">3 Hours (Min)</option>
                        <option value="4">4 Hours</option>
                        <option value="8">8 Hours</option>
                    </select>
                </div>
                <button class="bl-confirm-btn" onclick="goToStep(2)">View Fleet Rates</button>
            </div>
        </div>

        <!-- STEP 2 -->
        <div id="bl-step-2" class="bl-step" style="display:none;">
            <div id="bl-fleet-list"></div>
            <div style="height: 120px;"></div>
            <button class="bl-continue-btn" id="bl-continue-btn" onclick="goToStep(3)">Confirm Selection</button>
        </div>

        <!-- STEP 3 -->
        <div id="bl-step-3" class="bl-step" style="display:none;">
            <div class="bl-search-card">
                <h2 style="font-weight:900; margin-bottom:20px;">Booking Details</h2>
                <div class="bl-input-group">
                    <div class="bl-input-item"><label>VIP Name</label><input type="text" id="pay-name" placeholder="Lead Passenger"></div>
                    <div class="bl-input-item"><label>Affiliate PO</label><input type="text" id="pay-ref" placeholder="Job Reference #"></div>
                    <div class="bl-input-item"><label>VIP Mobile</label><input type="tel" id="pay-phone" placeholder="Contact #"></div>
                </div>
                <div style="background:#f8f9fc; padding:20px; border-radius:16px; margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Vehicle:</span><b id="summary-v-name">---</b></div>
                    <div style="display:flex; justify-content:space-between;"><span>Total Rate:</span><b id="summary-total" style="font-size:1.4rem; color:#5d2b45;">$0.00</b></div>
                </div>
                <button class="bl-confirm-btn" onclick="handleFinalReservation()">Secure Booking</button>
            </div>
        </div>
    </div>

    <footer class="footer" style="background:#000; padding:60px 0; color:#fff; text-align:center; margin-top: 80px;">
        <p style="color: #D4AF37; font-weight: 800; margin-bottom: 20px;">SM LIMOUSINE | Global Affiliate Network</p>
        <p style="color:#444; font-size:0.8rem;">© 2026 SM LIMO LLC. Confidential.</p>
    </footer>

    <script src="script.js?v=master_final_27.1"></script>
    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            if (nav) nav.classList.toggle('active');
        }
    </script>
</body>
</html>
