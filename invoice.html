<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | SM LIMOUSINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --silver: #C0C0C0; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .invoice-card { background: #0c0c0c; border: 1px solid #222; border-radius: 20px; width: 100%; max-width: 600px; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .header { text-align: center; border-bottom: 1px solid #222; padding-bottom: 30px; margin-bottom: 30px; }
        .logo { height: 60px; margin-bottom: 15px; }
        .title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--silver); letter-spacing: 2px; text-transform: uppercase; }
        
        .paid-stamp { 
            position: absolute; top: 40px; right: 40px; 
            border: 4px solid #28a745; color: #28a745; 
            font-weight: 900; font-size: 1.5rem; padding: 10px 20px; 
            text-transform: uppercase; border-radius: 8px; 
            transform: rotate(15deg); opacity: 0.8; display: none; 
        }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .detail-item label { display: block; font-size: 0.7rem; text-transform: uppercase; color: #666; letter-spacing: 1px; margin-bottom: 5px; }
        .detail-item span { font-size: 1rem; color: #fff; font-weight: 600; }
        
        .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        .summary-table th { text-align: left; font-size: 0.8rem; color: #666; padding-bottom: 10px; border-bottom: 1px solid #222; }
        .summary-table td { padding: 20px 0; font-size: 1rem; border-bottom: 1px solid #111; }
        .total-row td { border-bottom: none; padding-top: 30px; }
        .total-label { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); }
        .total-amount { font-size: 1.8rem; font-weight: 800; color: #fff; text-align: right; }

        .btn-pay { display: block; width: 100%; padding: 20px; background: var(--gold); color: #000; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; margin-bottom: 20px; }
        .btn-download { display: block; width: 100%; padding: 15px; background: transparent; border: 1px solid #333; color: #888; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem; }
        
        .footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: #444; }
        
        .route-info { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid #222; margin-bottom: 30px; display: none; }
        .route-item { margin-bottom: 10px; text-align: left; }
        .route-item label { display: block; font-size: 0.65rem; text-transform: uppercase; color: #666; margin-bottom: 2px; }
        .route-item span { font-size: 0.9rem; color: #eee; }
        @media print { .btn-pay { display: none !important; } }
    </style>
</head>
<body>
    <div class="invoice-card">
        <div class="paid-stamp" id="paid-stamp">PAID</div>
        <div class="header">
            <img src="sm_logo_silver.png" alt="SM LIMOUSINE" class="logo">
            <div class="title">SM LIMOUSINE</div>
            <p style="color: #666; font-size: 0.9rem;"><span id="label-type">Invoice</span> #<span id="disp-inv">---</span></p>
        </div>

        <div class="details-grid">
            <div class="detail-item"><label>Billed To</label><span id="disp-name">---</span></div>
            <div class="detail-item" style="text-align:right;"><label>Date</label><span id="disp-date">---</span></div>
        </div>

        <div class="route-info" id="route-info">
            <div class="route-item"><label>Trip Date(s)</label><span id="disp-trip-date"></span></div>
            <div class="route-item"><label>Pickup Address</label><span id="disp-pickup"></span></div>
            <div class="route-item"><label>Drop-off Address</label><span id="disp-dropoff"></span></div>
        </div>
        <table class="summary-table">
            <thead><tr><th>Description</th><th style="text-align:right;">Amount</th></tr></thead>
            <tbody>
                <tr><td>Executive Chauffeur Service - <span id="disp-vehicle">Vehicle</span></td><td style="text-align:right;" id="disp-subtotal">$0.00</td></tr>
                <tr class="total-row">
                    <td class="total-label">Grand Total</td>
                    <td class="total-amount" id="disp-total">$0.00</td>
                </tr>
            </tbody>
        </table>

        <a href="#" id="pay-link" class="btn-pay">Pay Securely Now</a>
        <a href="javascript:window.print()" class="btn-download">Download PDF Copy</a>

        <div class="footer">
            3500 Oak Lawn Ave, Dallas, TX 75219<br>
            sam@sm-limo.com | +1 817-723-4592
        </div>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const name = p.get('n') || 'Guest';
        const total = p.get('a') || '0.00';
        const vehicle = p.get('v') || 'Premium Fleet';
        const inv = p.get('i') || '---';
        const isPaid = p.get('p') === '1';
        const date = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

        document.getElementById('disp-name').innerText = name;
        document.getElementById('disp-total').innerText = '$' + total;
        document.getElementById('disp-subtotal').innerText = '$' + total;
        document.getElementById('disp-vehicle').innerText = vehicle;
        document.getElementById('disp-inv').innerText = inv;
        document.getElementById('disp-date').innerText = date;

        const tripDate = p.get('d');
        const pickup = p.get('pu');
        const dropoff = p.get('do');

        if (tripDate || pickup || dropoff) {
            document.getElementById('route-info').style.display = 'block';
            if (tripDate) document.getElementById('disp-trip-date').innerText = tripDate;
            if (pickup) document.getElementById('disp-pickup').innerText = pickup;
            if (dropoff) document.getElementById('disp-dropoff').innerText = dropoff;
        }

        if (isPaid) {
            document.getElementById('paid-stamp').style.display = 'block';
            document.getElementById('pay-link').style.display = 'none';
            document.getElementById('label-type').innerText = 'Receipt';
            document.title = 'Receipt | SM LIMOUSINE';
        } else {
            document.getElementById('pay-link').href = 'https://sm-limo.com/pay.html?a=' + total + '&n=' + encodeURIComponent(name);
        }
    </script>
</body>
</html>
