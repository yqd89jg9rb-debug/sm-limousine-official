<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Invoice Creator | SM LIMOUSINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8f9fc; font-family: 'Inter', sans-serif; padding: 40px 10px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        h1 { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 40px; }
        
        .section-title { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; color: #D4AF37; border-bottom: 2px solid #eee; padding-bottom: 10px; margin: 40px 0 20px 0; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 10px; font-size: 1rem; background: #fbfbfb; box-sizing: border-box; }
        input:focus { border-color: #000; outline: none; background: #fff; }
        
        .leg-box { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        
        button.primary-btn { width: 100%; padding: 20px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; margin-top: 30px; }
        .result-box { margin-top: 40px; padding: 30px; background: #f1f3f9; border-radius: 16px; display: none; }
        .link-text { word-break: break-all; font-family: monospace; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin: 15px 0; font-size: 0.9rem; }
        
        .btn-row { display: flex; gap: 10px; }
        .btn-row button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; }
        .copy-btn { background: #444; color: #fff; }
        .preview-btn { background: #D4AF37; color: #000; }
        
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elite Invoice Creator</h1>
        
        <div class="section-title">Invoice Information</div>
        <div class="grid">
            <div class="field"><label>Invoice #</label><input id="i" placeholder="3001"></div>
            <div class="field"><label>Invoice Date</label><input id="id" type="text" placeholder="July 10, 2026"></div>
        </div>

        <div class="section-title">Client Details</div>
        <div class="grid">
            <div class="field"><label>Full Name</label><input id="n" placeholder="Richard Mange"></div>
            <div class="field"><label>Phone Number</label><input id="ph" placeholder="+1 (817) 000-0000"></div>
            <div class="field"><label>Email Address</label><input id="em" placeholder="client@example.com"></div>
            <div class="field"><label>Company/Billing Address</label><input id="addr" placeholder="1220 Robin Dr, Keller, TX 76262"></div>
        </div>

        <div class="section-title">Ride Details (Leg 1)</div>
        <div class="leg-box">
            <div class="grid">
                <div class="field"><label>Date</label><input id="d1" placeholder="5/16/2026"></div>
                <div class="field"><label>Vehicle</label><input id="v1" placeholder="SUV"></div>
            </div>
            <div class="field"><label>Pickup Address</label><input id="pu1" placeholder="1220 Robin Dr, Keller"></div>
            <div class="field"><label>Drop-off Address</label><input id="do1" placeholder="DFW Airport"></div>
        </div>

        <div class="section-title">Ride Details (Leg 2 / Return)</div>
        <div class="leg-box">
            <div class="grid">
                <div class="field"><label>Date</label><input id="d2" placeholder="5/21/2026"></div>
                <div class="field"><label>Vehicle</label><input id="v2" placeholder="SUV"></div>
            </div>
            <div class="field"><label>Pickup Address</label><input id="pu2" placeholder="DFW Airport"></div>
            <div class="field"><label>Drop-off Address</label><input id="do2" placeholder="1220 Robin Dr, Keller"></div>
        </div>

        <div class="section-title">Charges & Fees</div>
        <div class="grid">
            <div class="field"><label>Base Rate ($)</label><input id="base" placeholder="200.00"></div>
            <div class="field"><label>Gratuity ($)</label><input id="grat" placeholder="40.00"></div>
            <div class="field"><label>Fuel / Other Fees ($)</label><input id="fuel" placeholder="0.00"></div>
            <div class="field">
                <label>Paid Status</label>
                <select id="s" style="width:100%; padding:14px; border-radius:10px; border:1px solid #eee;">
                    <option value="0">Unpaid</option>
                    <option value="1">PAID (Show Stamp)</option>
                </select>
            </div>
        </div>

        <div class="field"><label>Notes</label><textarea id="notes" rows="3">Rates per vehicle. 24hr cancel policy. Payment due on receipt.</textarea></div>

        <button class="primary-btn" onclick="generate()">Generate Elite Invoice Link</button>

        <div class="result-box" id="result">
            <label>Branded Link Ready:</label>
            <div class="link-text" id="link-display"></div>
            <div class="btn-row">
                <button class="copy-btn" onclick="copy()">Copy Link</button>
                <button class="preview-btn" onclick="preview()">Open Preview</button>
            </div>
        </div>
    </div>

    <script>
        function generate() {
            const fields = ['n','addr','ph','em','i','id','d1','v1','pu1','do1','d2','v2','pu2','do2','base','grat','fuel','s','notes'];
            const params = new URLSearchParams();
            
            let total = 0;
            fields.forEach(f => {
                const val = document.getElementById(f).value;
                if(val) params.append(f, val);
                if(['base','grat','fuel'].includes(f)) total += parseFloat(val || 0);
            });
            params.append('total', total.toFixed(2));

            const finalUrl = "https://sm-limo.com/invoice.html?" + params.toString();
            document.getElementById('link-display').innerText = finalUrl;
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        function copy() {
            const text = document.getElementById('link-display').innerText;
            navigator.clipboard.writeText(text);
            alert("Link Copied!");
        }

        function preview() {
            window.open(document.getElementById('link-display').innerText, '_blank');
        }
    </script>
</body>
</html>
