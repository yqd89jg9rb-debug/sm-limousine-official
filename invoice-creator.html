<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Creator | SM LIMOUSINE</title>
    <style>
        body { background: #f8f9fc; font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .creator-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h1 { font-size: 1.2rem; margin-bottom: 25px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        #result { margin-top: 30px; padding: 20px; background: #f1f1f1; border-radius: 6px; word-break: break-all; display: none; }
    </style>
</head>
<body>
    <div class="creator-card">
        <img src="sm_logo_silver.png" style="height:40px; margin-bottom:20px;">
        <h1>Elite Invoice Creator</h1>
        <div class="field"><label>Client Name</label><input id="name" placeholder="e.g. John Doe"></div>
        <div class="field"><label>Total Amount ($)</label><input id="amount" placeholder="e.g. 150.00"></div>
        <div class="field"><label>Vehicle Used</label><input id="vehicle" placeholder="e.g. 2026 Cadillac Escalade"></div>
        <div class="field"><label>Invoice Number (Optional)</label><input id="inv" placeholder="e.g. 1001"></div>
        <button onclick="generate()">Generate Invoice Link</button>

        <div id="result">
            <label>Copy & Text this link to Client:</label>
            <p id="link-text" style="font-size: 0.85rem; color: #007bff; margin: 10px 0; font-family: monospace;"></p>
            <button style="background: #444;" onclick="copy()">Copy Link</button>
        </div>
    </div>

    <script>
        function generate() {
            const name = document.getElementById('name').value;
            const amount = document.getElementById('amount').value;
            const vehicle = document.getElementById('vehicle').value;
            const inv = document.getElementById('inv').value;

            const base = "https://sm-limo.com/invoice.html";
            const params = new URLSearchParams({ n: name, a: amount, v: vehicle, i: inv });
            const fullUrl = base + "?" + params.toString();
            
            document.getElementById('link-text').innerText = fullUrl;
            document.getElementById('result').style.display = 'block';
        }
        function copy() {
            const text = document.getElementById('link-text').innerText;
            navigator.clipboard.writeText(text).then(() => alert('Link Copied!'));
        }
    </script>
</body>
</html>
