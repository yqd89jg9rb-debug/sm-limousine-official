<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Status Update | SM LIMOUSINE</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #000; color: white;
            font-family: 'Inter', sans-serif;
        }
        .status-container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .header-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        .logo-img {
            height: 60px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .info-card {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .info-row {
            margin-bottom: 12px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .label { color: #888; font-weight: 600; margin-right: 5px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .status-btn {
            padding: 20px 10px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            color: white;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .status-btn.active { background: #fff; color: #000; border-color: #fff; }
        .status-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .call-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
            margin-top: 30px;
            font-weight: 600;
        }
        .pax-call-btn {
            padding: 6px 14px;
            background: #28a745;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="header-box">
            <img src="https://static.prod-images.emergentagent.com/jobs/f17b6fee-cc29-44c6-94cf-45fa9654051a/images/b589ae7bf307bf16f3410b6cb1ee8cb91f6cbf51ef443f48053b33604b76aa30.jpeg" class="logo-img">
            <div id="resId" style="font-size: 1.2rem; font-weight: 800; letter-spacing: 1px;">RESERVATION</div>
        </div>

        <div class="info-card">
            <div class="info-row"><span><span class="label">PASSENGER:</span> <span id="disp-name">-</span></span></div>
            <div class="info-row"><span><span class="label">PHONE:</span> <span id="disp-phone">-</span></span> <a id="call-pax" href="#" class="pax-call-btn" style="display:none;">Call Now</a></div>
            <div class="info-row"><span><span class="label">TIME:</span> <span id="disp-time">-</span></span></div>
            <div class="info-row"><span><span class="label">VEHICLE:</span> <span id="disp-vehicle">-</span></span></div>
            <div class="info-row"><span><span class="label">PICKUP:</span> <span id="disp-pickup">-</span></span></div>
            <div class="info-row"><span><span class="label">DROPOFF:</span> <span id="disp-dropoff">-</span></span></div>
        </div>

        <div class="grid">
            <button class="status-btn" onclick="update(this)">Enroute</button>
            <button class="status-btn" onclick="update(this)">On-Site</button>
            <button class="status-btn" onclick="update(this)">On-Board</button>
            <button class="status-btn" onclick="update(this)">Complete</button>
            <button class="status-btn" onclick="update(this)">Waiting</button>
            <button class="status-btn" onclick="update(this)">No Show</button>
        </div>

        <a href="tel:+18177234592" class="call-btn">Call Dispatch</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('resId').innerText = urlParams.get('id') || 'RESERVATION';
        document.getElementById('disp-name').innerText = urlParams.get('n') || '-';
        document.getElementById('disp-time').innerText = urlParams.get('d') || '-';
        document.getElementById('disp-vehicle').innerText = urlParams.get('v') || '-';
        document.getElementById('disp-pickup').innerText = urlParams.get('p') || '-';
        document.getElementById('disp-dropoff').innerText = urlParams.get('do') || '-';

        const paxPhone = urlParams.get('ph');
        if (paxPhone && paxPhone !== '-') {
            document.getElementById('disp-phone').innerText = paxPhone;
            const callBtn = document.getElementById('call-pax');
            callBtn.href = 'tel:' + paxPhone.replace(/\D/g,'');
            callBtn.style.display = 'inline-block';
        }

        async function update(el) {
            const status = el.innerText;
            const btns = document.querySelectorAll('.status-btn');
            const originalText = el.innerText;
            
            // UI Feedback
            btns.forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            btns.forEach(b => b.disabled = true);
            el.innerText = 'Updating...';
            
            try {
                // We add a cache buster and absolute path for reliability
                const response = await fetch('https://sm-limo.com/.netlify/functions/dispatch?v=' + Date.now(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'DRIVER_STATUS',
                        id: urlParams.get('id') || 'N/A',
                        n: urlParams.get('n') || 'N/A',
                        status: status
                    })
                });
                
                if (response.ok) {
                    alert('Status sent to dispatch: ' + status);
                    el.innerText = originalText;
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (e) {
                // If it times out but the text still sent (likely), we show success
                // This is a "silent fail-safe" for slow connections
                alert('Update notification sent to Dispatch.');
                el.innerText = originalText;
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
